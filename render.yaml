# Render Blueprint: creates the web service and a Postgres database, and links them.
# In the Render dashboard: New > Blueprint, then pick this repo.
services:
  - type: web
    name: task-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-calendar-db
          property: connectionString
      # Your Canvas iCal feed URL. Render asks for the value when the Blueprint is created.
      - key: FEED_URL
        sync: false

databases:
  - name: task-calendar-db
    plan: free
    databaseName: tasks
