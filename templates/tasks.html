<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Database View</title>
    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
    <!-- Task View Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">
</head>
<body>

    <header class="navbar">
        <h1>Task Database</h1>
        <span id="sync-status">Auto-Sync Active</span>
    </header>

    <div class="table-container">
        <div class="view-nav">
            <a href="/">📅 Calendar View</a>
            <a href="/tasks" class="active">📋 All Tasks View</a>
        </div>
        <div class="task-form-card" style="margin-bottom: 20px; background: #1E3E62; padding: 15px; border-radius: 8px; border: 1px solid #2B527A;">
          <h3 style="color: #f8fafc; font-size: 1rem; margin-bottom: 10px;">Add New Task</h3>
          <form id="create-task-form" style="display: flex; gap: 10px; flex-wrap: wrap;">
              <input type="text" id="new-title" placeholder="Task name..." required style="flex: 2; background: #09122C; border: 1px solid #2B527A; color: #f1f5f9; padding: 6px 10px; border-radius: 4px;">
              <input type="date" id="new-date" required style="flex: 1; background: #09122C; border: 1px solid #2B527A; color: #f1f5f9; padding: 6px 10px; border-radius: 4px;">
              <button type="submit" style="background: #6366F1; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: 600;">Add Task</button>
          </form>
        </div>

        <table class="task-table">
            <thead>
                <tr>
                    <th><span><b>Aa</b></span> Task name</th>
                    <th><span>🔆</span> Status</th>
                    <th><span>📅</span> Due date</th>
                    <th><span>🔽</span> Priority</th>
                    <th><span>📐</span> Subject</th>
                    <th><span>📋</span> Task Type</th>
                    <th><span>⏳</span> Effort level ℹ️</th>
                </tr>
            </thead>
            <tbody id="task-table-body">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
</body>
</html>
