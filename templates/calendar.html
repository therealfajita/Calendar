<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar Dashboard</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
    <!-- FullCalendar Library -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>

    <header class="navbar">
        <h1>Task & Assignment Dashboard</h1>
        <span id="sync-status">Auto-Sync Active</span>
    </header>

    <div class="container">
        <!-- Main Calendar View -->
        <main class="calendar-card">
            <div id="calendar"></div>
        </main>

        <!-- Sidebar Task Tracker -->
        <aside class="sidebar-card">
            <h2>Upcoming Tasks</h2>
            <ul id="task-list"></ul>
        </aside>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var taskListEl = document.getElementById('task-list');

        // Initialize FullCalendar
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          events: '/api/tasks',
          eventClick: function(info) {
            // Toggle task completed status when clicked on calendar
            toggleTaskStatus(info.event.id);
          }
        });

        calendar.render();

        // Load side list view
        function loadTaskList() {
            fetch('/api/tasks')
                .then(res => res.json())
                .then(events => {
                taskListEl.innerHTML = '';
                events.forEach(task => {
                    const li = document.createElement('li');
                    
                    // Add class code styling along with completed check
                    const classStyle = task.status === 'Completed' ? 'done' : `class-${task.classCode.toLowerCase()}`;
                    li.className = `task-item ${classStyle}`;
                    
                    li.innerHTML = `
                    <div>
                        <span class="task-badge">${task.classCode !== 'DEFAULT' ? task.classCode : 'General'}</span>
                        <span class="task-title">${task.title}</span>
                    </div>
                    <span class="task-date" style="color: black;"><strong>${new Date(task.start).toLocaleDateString()}</strong></span>
                    `;
                    li.onclick = () => toggleTaskStatus(task.id);
                    taskListEl.appendChild(li);
                });
                });
        }

        function toggleTaskStatus(uid) {
          fetch('/api/tasks/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid: uid })
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              calendar.refetchEvents();
              loadTaskList();
            }
          });
        }

        // Initial sidebar load
        loadTaskList();

        // Refresh data every 5 minutes automatically
        setInterval(() => {
          calendar.refetchEvents();
          loadTaskList();
        }, 300000);
      });
    </script>
</body>
</html>
