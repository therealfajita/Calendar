<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>
    <header class="navbar">
        <h1>Task & Assignment Dashboard</h1>
        <span id="sync-status">Auto-Sync Active</span>
    </header>
    <div class="table-container" style="padding-bottom: 0;">
        <div class="view-nav">
            <a href="/" class="active">📅 Calendar View</a>
            <a href="/tasks">📋 All Tasks View</a>
        </div>
    </div>

    <div class="container">
        <main class="calendar-card">
            <div id="calendar"></div>
        </main>
        <aside class="sidebar-card">
            <h2>Upcoming Tasks</h2>
            <ul id="task-list"></ul>
        </aside>
    </div>

    <!-- New Task Modal (opened by clicking a day on the calendar) -->
    <div id="new-task-modal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="new-task-modal-title">
            <h3 id="new-task-modal-title">New Task</h3>
            <p class="modal-subtitle">Due <strong id="new-task-date-label"></strong></p>
            <form id="calendar-task-form">
                <label for="calendar-task-title">Task name</label>
                <input type="text" id="calendar-task-title" placeholder="e.g. HW 5 [CS 2316 B]" required autocomplete="off">

                <div class="modal-row">
                    <div>
                        <label for="calendar-task-type">Task Type</label>
                        <select id="calendar-task-type">
                            <option value="">Auto</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Quiz">Quiz</option>
                            <option value="Exam">Exam</option>
                            <option value="Study">Study</option>
                            <option value="Project">Project</option>
                        </select>
                    </div>
                    <div>
                        <label for="calendar-task-priority">Priority</label>
                        <select id="calendar-task-priority">
                            <option value="">Auto</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div>
                        <label for="calendar-task-effort">Effort level</label>
                        <select id="calendar-task-effort">
                            <option value="">Auto</option>
                            <option value="Low Effort">Low Effort</option>
                            <option value="Medium Effort">Medium Effort</option>
                            <option value="High Effort">High Effort</option>
                        </select>
                    </div>
                </div>

                <p id="calendar-task-error" class="modal-error" hidden></p>

                <div class="modal-actions">
                    <button type="button" id="calendar-task-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- External Script -->
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</body>
</html>
